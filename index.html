<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aubital</title>
    <meta
      name="description"
      content="Aubital — draw looping melodies on a spinning cylinder. iOS and web."
    />
    <link rel="canonical" href="https://aubital.f-90.co.uk/" />
    <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./assets/app-icon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body class="home">
    <main>
      <section class="stage" aria-label="Aubital">
        <div class="stageGlow" aria-hidden="true"></div>
        <canvas class="sculpture" aria-hidden="true"></canvas>
        <div class="hero">
          <img
            class="logotype"
            src="./assets/logotype-white.svg"
            width="235"
            height="54"
            alt="Aubital"
          />
          <nav class="ctaRow" aria-label="Get Aubital">
            <a class="glass-pill" href="./web/">Web</a>
            <a
              class="glass-pill"
              href="https://apps.apple.com/"
              id="ios-store"
              target="_blank"
              rel="noopener noreferrer"
            >
              iOS · Coming soon
            </a>
          </nav>
        </div>
      </section>
    </main>

    <footer class="siteFooter">
      <div class="frame">
        <div>
          <p>A product from <a href="https://f-90.co.uk">f-90</a></p>
          <p>© <span id="y"></span> Aubital</p>
        </div>
        <nav class="footerLinks" aria-label="Legal">
          <a href="./support/">Support</a>
          <a href="./privacy/">Privacy</a>
        </nav>
      </div>
    </footer>
    <script src="./sculpture.js"></script>
    <script src="./site.js"></script>
  </body>
</html>
